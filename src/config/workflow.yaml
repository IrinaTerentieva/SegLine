dataset:
  ground_footprint: "/path/to/data.gpkg"
  ground_footprint_layer: null      # null if NO layer
  centerline: "/path/to/data.gpkg"
  centerline_layer: null            # null if NO layer
  debug: false
  unique_id_length: 6
  min_length: 20
  width_column: "avg_width_neg1"  # Column name for width values in your data

