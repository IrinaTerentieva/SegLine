dataset:
  # Sample data (8 seismic lines, 1 x 1 km). Point these at your own FLM outputs,
  # or put your paths in src/config/local/private.yaml (git-ignored, overrides this file).
  ground_footprint: "sample_data/sample_footprint.gpkg"
  ground_footprint_layer: null      # null if NO layer
  centerline: "sample_data/sample_centerlines.gpkg"
  centerline_layer: null            # null if NO layer
  debug: false
  unique_id_length: 4
  min_length: 20
  width_column: "width"  # Column name for width values in your data

smoothing:
  use_assign_id_output: true
  perform_smoothing: false
  # When not using assign_ID output, set an alternative centerline path here.
  centerline: "/path/to/data.gpkg"
  angle_threshold: 120   # Lower threshold triggers smoothing on more vertices
  buffer_distance: 2     # Increase buffer for stronger smoothing
  num_workers: 4

split_to_plots:
  plot_area: 100
  num_workers: 24
  extension_distance: 100
  max_splitter_length_buffer: 50
  perpendicular_spacing: 50  # Fixed spacing in meters between perpendiculars

split_to_side:
  splitting_method: "area"   # "area" or "length"
  plot_area: 50
  segment_length: 100
  min_area: 5

split_to_subplots:
  subplot_area: 20         # Should be 1/5 of plot area!!!
  min_area_fraction: 0.06  # Merge subplots smaller than this fraction of plot_area (0.05 * 50 = 2.5 m²)
  num_workers: 24
  max_splitter_length_buffer: 50
  use_smooth_centerline: true
  perpendicular_spacing: 10  # Fixed spacing in meters between perpendiculars